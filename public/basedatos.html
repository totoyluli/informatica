<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="login.html">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Panel de Usuarios</span>
            <a href="login.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Formulario de Crear / Editar -->
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h4 id="form-title" class="card-title mb-3">Nuevo Usuario</h4>
                        <form id="userForm">
                            <input type="hidden" id="userId">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3" id="password-group">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="btn-submit">Guardar</button>
                            <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btn-cancel" onclick="resetForm()">Cancelar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Usuarios -->
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Lista de Usuarios</h4>
                        <div class="table-responsive">
                            <table class="table table-striped align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="usuariosTableBody">
                                    <!-- Los datos se cargan dinámicamente con JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/usuarios';

        document.addEventListener('DOMContentLoaded', cargarUsuarios);

        // Obtener y mostrar usuarios
        async function cargarUsuarios() {
            try {
                const res = await fetch(API_URL);
                const usuarios = await res.json();
                const tbody = document.getElementById('usuariosTableBody');
                tbody.innerHTML = '';

                usuarios.forEach(user => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.nombre}</td>
                            <td>${user.email}</td>
                            <td>
                                <button class="btn btn-primary btn-sm" onclick="editarUsuario(${user.id}, '${user.nombre}', '${user.email}')">Editar</button>
                                <button class="btn btn-danger btn-sm" onclick="eliminarUsuario(${user.id})">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error al cargar usuarios:', error);
            }
        }

        // Crear o Editar usuario
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (id) {
                // Actualizar (UPDATE)
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email })
                });
            } else {
                // Crear (CREATE)
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });
            }

            resetForm();
            cargarUsuarios();
        });

        // Preparar formulario para edición
        function editarUsuario(id, nombre, email) {
            document.getElementById('userId').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('email').value = email;
            
            // Ocultar campo contraseña en edición (opcional)
            document.getElementById('password-group').style.display = 'none';
            document.getElementById('password').required = false;

            document.getElementById('form-title').textContent = 'Editar Usuario';
            document.getElementById('btn-submit').textContent = 'Actualizar';
            document.getElementById('btn-submit').className = 'btn btn-primary w-100';
            document.getElementById('btn-cancel').classList.remove('d-none');
        }

        // Eliminar usuario (DELETE)
        async function eliminarUsuario(id) {
            if (confirm('¿Estás seguro de eliminar este usuario?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                cargarUsuarios();
            }
        }

        // Resetear formulario
        function resetForm() {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('password-group').style.display = 'block';
            document.getElementById('password').required = true;
            document.getElementById('form-title').textContent = 'Nuevo Usuario';
            document.getElementById('btn-submit').textContent = 'Guardar';
            document.getElementById('btn-submit').className = 'btn btn-success w-100';
            document.getElementById('btn-cancel').classList.add('d-none');
        }
    </script>
</body>
</html>
