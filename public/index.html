<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Traductor de Señas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        
        <!-- Mensaje de error si la contraseña o correo son incorrectos -->
        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="admin@admin.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required placeholder="1234">
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar al Traductor</button>
        </form>
    </div>

    <script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorAlert = document.getElementById('error-alert');

    errorAlert.classList.add('d-none');

    try {
        const response = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        // Validar primero si el servidor respondió correctamente
        if (!response.ok) {
            const textError = await response.text();
            throw new Error(`Error del servidor (${response.status}): ${textError}`);
        }

        const data = await response.json();

        if (data.success) {
            window.location.href = 'app.html';
        } else {
            errorAlert.textContent = data.message || 'Credenciales inválidas';
            errorAlert.classList.remove('d-none');
        }
    } catch (error) {
        console.error('Error al conectar:', error);
        errorAlert.textContent = 'No se pudo conectar con el servidor backend';
        errorAlert.classList.remove('d-none');
    }
});
    </script>
</body>
</html>
